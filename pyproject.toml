[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai_kavach"
version = "0.1.0"
description = "AI Kavach Cyber Reasoning System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "anthropic",
    "openai>=1.0.0",
    "requests",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "python-multipart"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_kavach"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.pyright]
extraPaths = ["."]
